experiment_name: m1-p0-Abalone19
run_id: null
dataset:
  dataset_id: Abalone19
  root_seed: 42
  reference_example_count: 4
  reference_examples_per_class: 2
  reference_examples_enabled: true
generation:
  requested_count: 40
  class_strategy: explicit
  class_quotas: {negative: 20, positive: 20}
  batch_size: 5
  objective: data_emulation
  generator_id: openai-compatible-generator
